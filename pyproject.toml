[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinglet-bio"
version = "0.1.0"
description = "Kinglet: kinglet-sized bioacoustic embedding and classification models distilled from Perch 2.0"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "onnxruntime>=1.17"]

[project.scripts]
kinglet = "kinglet.cli:main"

[tool.setuptools]
packages = ["kinglet"]
