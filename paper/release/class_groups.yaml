# Written with Claude (Anthropic) under the author's direction; see paper/README.md.
version: 1
note: Perch 2.0 FSD50K class -> sound-group mapping of the Kinglet packs (v0.3.2 and v0.4.0 Japan packs). A
  group score is the sum of the member softmax probabilities. The group rows are part of the compact output
  layer for computers; the operating thresholds of the groups are stored in the packs (group_thresholds) and
  are not evaluated in the paper. other_anthrophony is a catch-all without a threshold. ungrouped = classes
  that overlap species classes or are source-ambiguous onomatopoeia; kept as individual rows only.
